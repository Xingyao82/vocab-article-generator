<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词文章生成器 - Word Article Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .word-tag {
            transition: all 0.2s;
        }
        .word-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .article-content {
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .article-content b, .article-content strong {
            color: #667eea;
            background: linear-gradient(120deg, #e0e7ff 0%, #e0e7ff 100%);
            background-repeat: no-repeat;
            background-size: 100% 40%;
            background-position: 0 88%;
            padding: 0 4px;
        }
        .loading-dots {
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <header class="text-center text-white mb-8">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">📝 单词文章生成器</h1>
            <p class="text-lg opacity-90">导入单词，自动生成包含这些单词的通顺文章</p>
        </header>

        <!-- Main Content -->
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Left Panel: Input -->
            <div class="glass-card rounded-2xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center mr-2 text-indigo-600">1</span>
                    输入单词
                </h2>

                <!-- Input Mode Tabs -->
                <div class="flex bg-gray-100 rounded-lg p-1 mb-4">
                    <button class="mode-btn active flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all" onclick="switchMode('manual', this)">
                        手动输入
                    </button>
                    <button class="mode-btn flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all" onclick="switchMode('file', this)">
                        文件上传
                    </button>
                </div>

                <!-- Manual Input -->
                <div id="manual-input" class="space-y-4">
                    <textarea 
                        id="word-input" 
                        class="w-full h-40 p-4 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none resize-none text-gray-700"
                        placeholder="输入单词，每行一个或空格分隔&#10;例如：&#10;apple&#10;banana&#10;computer"
                    ></textarea>
                    <p class="text-xs text-gray-500">支持格式：每行一个单词 或 空格/逗号分隔</p>
                </div>

                <!-- File Upload -->
                <div id="file-input" class="hidden space-y-4">
                    <input type="file" id="file-upload" class="hidden" accept=".txt,.csv,.json" onchange="handleFileUpload(event)">
                    <label for="file-upload" class="block border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-indigo-500 hover:bg-indigo-50 transition-all cursor-pointer">
                        <div class="text-4xl mb-2">📄</div>
                        <p class="text-gray-600 font-medium">点击选择文件</p>
                        <p class="text-xs text-gray-400 mt-1">支持 .txt, .csv, .json 格式</p>
                    </label>
                </div>

                <!-- Word Preview -->
                <div id="word-preview" class="mt-4 hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-medium text-gray-600">已识别单词：</span>
                        <span id="word-count" class="text-sm bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full">0 个</span>
                    </div>
                    <div id="word-tags" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                    </div>
                </div>

                <!-- Settings -->
                <div class="mt-6 space-y-4">
                    <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                        <span class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center mr-2 text-indigo-600">2</span>
                        生成设置
                    </h3>

                    <!-- API Mode -->
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="api-mode" value="template" class="w-4 h-4 text-indigo-600" checked onchange="toggleApiKey()">
                            <span class="text-gray-700">纯模板规则（推荐，无需 API，0 成本）</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="api-mode" value="openai" class="w-4 h-4 text-indigo-600" onchange="toggleApiKey()">
                            <span class="text-gray-700">OpenAI GPT（可选增强，需要 API Key）</span>
                        </label>
                    </div>

                    <!-- API Key Input -->
                    <div id="api-key-section" class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">OpenAI API Key</label>
                        <input 
                            type="password" 
                            id="api-key" 
                            class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none"
                            placeholder="sk-..."
                        >
                        <p class="text-xs text-gray-500">API Key 仅存储在本地浏览器中，不会上传到服务器</p>
                    </div>

                    <!-- Article Settings -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">文章长度</label>
                            <select id="length" class="w-full p-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none">
                                <option value="short">短文 (~200词)</option>
                                <option value="medium" selected>中等 (~400词)</option>
                                <option value="long">长文 (~600词)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">难度等级</label>
                            <select id="difficulty" class="w-full p-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none">
                                <option value="elementary">小学</option>
                                <option value="middle">初中</option>
                                <option value="high" selected>高中</option>
                                <option value="college">大学</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">文章主题（可选）</label>
                        <input 
                            type="text" 
                            id="topic" 
                            class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none"
                            placeholder="例如：科技、环保、日常生活..."
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">文风</label>
                        <select id="style" class="w-full p-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none">
                            <option value="narrative" selected>高级叙事风（推荐）</option>
                            <option value="academic">考试议论文风</option>
                            <option value="magazine">科技杂志风</option>
                        </select>
                    </div>
                </div>

                <!-- Generate Button -->
                <button onclick="generateArticle()" class="btn-primary w-full py-4 text-white font-semibold rounded-xl mt-6 flex items-center justify-center space-x-2">
                    <span>✨ 生成文章</span>
                </button>
            </div>

            <!-- Right Panel: Output -->
            <div class="glass-card rounded-2xl p-6 shadow-2xl flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800 flex items-center">
                        <span class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center mr-2 text-indigo-600">3</span>
                        生成结果
                    </h2>
                    <div class="flex space-x-2">
                        <button onclick="copyArticle()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium transition-colors">
                            📋 复制
                        </button>
                        <button onclick="downloadArticle()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium transition-colors">
                            💾 下载
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading" class="hidden flex-1 flex items-center justify-center">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                        <p class="text-gray-600">正在生成内容<span class="loading-dots"></span></p>
                        <p class="text-xs text-gray-400 mt-2">模板模式通常 1 秒内完成；AI 模式约 10-30 秒</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="flex-1 flex items-center justify-center text-gray-400">
                    <div class="text-center">
                        <div class="text-6xl mb-4">📝</div>
                        <p>输入单词并点击生成按钮</p>
                    </div>
                </div>

                <!-- Article Output -->
                <div id="article-output" class="hidden flex-1 flex flex-col">
                    <div class="flex items-center justify-between mb-3 text-sm text-gray-500">
                        <span id="article-stats"></span>
                        <span id="article-mode" class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs"></span>
                    </div>
                    <div id="article-content" class="article-content prose prose-indigo max-w-none flex-1 overflow-y-auto p-4 bg-gray-50 rounded-xl">
                    </div>
                    <div class="mt-4 text-xs text-gray-400">
                        💡 提示：粗体字为需要学习的生词
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-white/70 mt-8 text-sm">
            <p>单词文章生成器 | 纯模板规则优先（可选 OpenAI 增强）| 数据仅存储在本地</p>
        </footer>
    </div>

    <script>
        let currentWords = [];

        // Load saved API key
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('openai_api_key');
            if (savedKey) {
                document.getElementById('api-key').value = savedKey;
            }
            
            // Auto-parse words on input
            document.getElementById('word-input').addEventListener('input', parseWords);
            toggleApiKey();
        });

        function switchMode(mode, btnEl = null) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            
            if (mode === 'manual') {
                document.getElementById('manual-input').classList.remove('hidden');
                document.getElementById('file-input').classList.add('hidden');
            } else {
                document.getElementById('manual-input').classList.add('hidden');
                document.getElementById('file-input').classList.remove('hidden');
            }
        }

        function parseWords() {
            const input = document.getElementById('word-input').value;
            const words = input.split(/[\n,，;；\s]+/)
                .map(w => w.trim().toLowerCase())
                .filter(w => w.length > 0);
            
            currentWords = [...new Set(words)]; // Remove duplicates
            displayWordPreview();
        }

        function displayWordPreview() {
            const preview = document.getElementById('word-preview');
            const count = document.getElementById('word-count');
            const tags = document.getElementById('word-tags');
            
            if (currentWords.length === 0) {
                preview.classList.add('hidden');
                return;
            }
            
            preview.classList.remove('hidden');
            count.textContent = `${currentWords.length} 个`;
            
            tags.innerHTML = currentWords.map(word => 
                `<span class="word-tag bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm cursor-pointer" onclick="removeWord('${word}')">${word} ×</span>`
            ).join('');
        }

        function removeWord(word) {
            currentWords = currentWords.filter(w => w !== word);
            document.getElementById('word-input').value = currentWords.join('\n');
            displayWordPreview();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                let words = [];

                if (file.name.endsWith('.json')) {
                    try {
                        const data = JSON.parse(content);
                        words = Array.isArray(data) ? data : data.words || [];
                    } catch {
                        alert('JSON 格式错误');
                        return;
                    }
                } else {
                    words = content.split(/[\n,，;；\s]+/)
                        .map(w => w.trim().toLowerCase())
                        .filter(w => w.length > 0);
                }

                currentWords = [...new Set(words)];
                document.getElementById('word-input').value = currentWords.join('\n');
                displayWordPreview();
                const manualBtn = document.querySelector('.mode-btn');
                switchMode('manual', manualBtn);
            };
            reader.readAsText(file);
        }

        function toggleApiKey() {
            const mode = document.querySelector('input[name="api-mode"]:checked').value;
            const apiSection = document.getElementById('api-key-section');
            if (mode === 'openai') {
                apiSection.classList.remove('hidden');
            } else {
                apiSection.classList.add('hidden');
            }
        }

        async function generateArticle() {
            if (currentWords.length === 0) {
                alert('请先输入单词');
                return;
            }

            const mode = document.querySelector('input[name="api-mode"]:checked').value;
            const length = document.getElementById('length').value;
            const difficulty = document.getElementById('difficulty').value;
            const topic = document.getElementById('topic').value;
            const style = document.getElementById('style').value;

            // Show loading
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('article-output').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                let article;
                if (mode === 'openai') {
                    article = await generateWithOpenAI(currentWords, length, difficulty, topic);
                } else {
                    article = generateWithTemplate(currentWords, length, difficulty, topic, style);
                }
                displayArticle(article, mode);
            } catch (error) {
                alert('生成失败：' + error.message);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
            }
        }

        async function generateWithOpenAI(words, length, difficulty, topic) {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) {
                throw new Error('请输入 OpenAI API Key');
            }

            // Save API key to localStorage
            localStorage.setItem('openai_api_key', apiKey);

            const lengthMap = {
                'short': '约200词',
                'medium': '约400词',
                'long': '约600词'
            };

            const difficultyMap = {
                'elementary': '小学水平',
                'middle': '初中水平',
                'high': '高中水平',
                'college': '大学水平'
            };

            const prompt = `请用${difficultyMap[difficulty]}的英文写一篇${lengthMap[length]}的文章。
要求：
1. 必须包含以下单词：${words.join(', ')}
2. 这些单词在文章中要用**加粗**标记
3. 文章要通顺、语法正确、文笔流畅
4. ${topic ? `主题围绕：${topic}` : '主题不限，但要有意义'}
5. 确保所有指定单词都出现至少一次
6. 返回格式：只返回文章正文，使用 Markdown 格式`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-3.5-turbo',
                    messages: [
                        { role: 'system', content: '你是一个专业的英语教育内容创作者，擅长根据给定单词创作通顺、有趣的文章。' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API 请求失败');
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        function getWordInfo(word) {
            const dict = {
                apple: { pos: 'n.', meaning: '苹果' },
                banana: { pos: 'n.', meaning: '香蕉' },
                computer: { pos: 'n.', meaning: '电脑' },
                improve: { pos: 'v.', meaning: '提高，改进' },
                practice: { pos: 'v./n.', meaning: '练习；实践' },
                challenge: { pos: 'n./v.', meaning: '挑战' },
                environment: { pos: 'n.', meaning: '环境' },
                technology: { pos: 'n.', meaning: '科技' },
                education: { pos: 'n.', meaning: '教育' },
                success: { pos: 'n.', meaning: '成功' },
                develop: { pos: 'v.', meaning: '发展；培养' },
                achieve: { pos: 'v.', meaning: '实现；达到' },
                efficient: { pos: 'adj.', meaning: '高效的' },
                creative: { pos: 'adj.', meaning: '有创造力的' }
            };

            const normalized = word.toLowerCase();
            if (dict[normalized]) return dict[normalized];

            if (normalized.endsWith('ly')) return { pos: 'adv.', meaning: '（副词，按词根理解）' };
            if (normalized.endsWith('ing') || normalized.endsWith('ed')) return { pos: 'v.', meaning: '（动词，按词根理解）' };
            if (normalized.endsWith('tion') || normalized.endsWith('ment') || normalized.endsWith('ness')) return { pos: 'n.', meaning: '（名词，按词根理解）' };
            if (normalized.endsWith('ful') || normalized.endsWith('ous') || normalized.endsWith('able')) return { pos: 'adj.', meaning: '（形容词，按词根理解）' };
            return { pos: 'word', meaning: '建议结合上下文记忆' };
        }

        function getStylePack(style) {
            const packs = {
                narrative: {
                    titleSuffix: 'A Personal Learning Journey',
                    openers: ['At first glance', 'From my recent practice', 'During this week\'s study', 'At the beginning of this learning cycle'],
                    transitions: ['Meanwhile', 'More importantly', 'As a result', 'In addition'],
                    closers: ['By the end of the day', 'Looking back now', 'In the long run']
                },
                academic: {
                    titleSuffix: 'An Analytical Reflection',
                    openers: ['In language learning', 'From an educational perspective', 'In practical communication contexts', 'In academic writing practice'],
                    transitions: ['Furthermore', 'Nevertheless', 'Consequently', 'Moreover'],
                    closers: ['In conclusion', 'To sum up', 'Overall']
                },
                magazine: {
                    titleSuffix: 'A Modern Use Case',
                    openers: ['In today\'s fast-changing world', 'Across modern workplaces', 'In the age of technology', 'As communication becomes global'],
                    transitions: ['At the same time', 'On top of that', 'For this reason', 'Notably'],
                    closers: ['Going forward', 'That is why', 'This trend shows']
                }
            };
            return packs[style] || packs.narrative;
        }

        function pick(arr, seed = 0) {
            if (!arr.length) return '';
            return arr[seed % arr.length];
        }

        function smoothJoin(items) {
            if (items.length <= 1) return items[0] || '';
            if (items.length === 2) return `${items[0]} and ${items[1]}`;
            return `${items.slice(0, -1).join(', ')}, and ${items[items.length - 1]}`;
        }

        function sentenceByDifficulty(difficulty, word, topicText, style) {
            const advancedMap = {
                narrative: `I deliberately placed **${word}** into a real-life scene related to ${topicText}, which made the expression feel natural rather than forced.`,
                academic: `In a discussion on ${topicText}, **${word}** serves as a precise lexical choice that improves both clarity and logic.`,
                magazine: `When talking about ${topicText}, **${word}** adds a sharper tone that sounds closer to authentic media English.`
            };

            if (difficulty === 'elementary') {
                return `I used **${word}** in a simple sentence about ${topicText}.`;
            }
            if (difficulty === 'middle') {
                return `When discussing ${topicText}, I tried to use **${word}** correctly in context.`;
            }
            return advancedMap[style] || advancedMap.narrative;
        }

        function generateWithTemplate(words, length, difficulty, topic, style = 'narrative') {
            const paraMap = { short: 2, medium: 3, long: 4 };
            const paragraphCount = paraMap[length] || 3;
            const topicText = topic?.trim() || 'learning English';
            const stylePack = getStylePack(style);
            const title = topicText === 'learning English'
                ? `Vocabulary Practice: ${stylePack.titleSuffix}`
                : `${topicText}: ${stylePack.titleSuffix}`;

            const vocabList = words.map((word, i) => {
                const info = getWordInfo(word);
                return `${i + 1}. **${word}** (${info.pos})：${info.meaning}`;
            }).join('\n');

            const exampleList = words.map((word, i) => `${i + 1}. ${sentenceByDifficulty(difficulty, word, topicText, style)}`).join('\n');

            const groups = chunkArray(words, Math.max(1, Math.ceil(words.length / paragraphCount)));

            let body = `${pick(stylePack.openers, words.length)}, I focused on ${topicText} and tried to activate my vocabulary in authentic contexts.`;

            groups.forEach((group, idx) => {
                if (!group.length) return;
                const highlighted = group.map((w) => `**${w}**`);
                const bridge = pick(stylePack.transitions, idx + group.length);

                body += `\n\n${bridge}, I integrated ${smoothJoin(highlighted)} into one coherent idea.`;
                group.forEach((word, innerIdx) => {
                    if (innerIdx > 1) return;
                    body += ` ${sentenceByDifficulty(difficulty, word, topicText, style)}`;
                });
                body += ` This paragraph-level connection improved fluency and made the wording sound less mechanical.`;
            });

            body += `\n\n${pick(stylePack.closers, words.length + paragraphCount)}, these words are no longer isolated items on a list; they now function as part of a complete expression system.`;

            return `# ${title}\n\n${body}`;
        }

        function chunkArray(array, size) {
            const chunks = [];
            for (let i = 0; i < array.length; i += size) {
                chunks.push(array.slice(i, i + size));
            }
            return chunks;
        }

        function displayArticle(article, mode) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('article-output').classList.remove('hidden');
            document.getElementById('article-output').classList.add('fade-in');

            // Highlight words in article
            let processedArticle = article;
            currentWords.forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'gi');
                processedArticle = processedArticle.replace(regex, `**${word}**`);
            });

            document.getElementById('article-content').innerHTML = marked.parse(processedArticle);
            
            // Stats
            const wordCount = article.split(/\s+/).length;
            document.getElementById('article-stats').textContent = `约 ${wordCount} 词`;
            document.getElementById('article-mode').textContent = mode === 'openai' ? 'AI 生成' : '模板生成';
        }

        function copyArticle() {
            const content = document.getElementById('article-content').innerText;
            navigator.clipboard.writeText(content).then(() => {
                showToast('✅ 已复制到剪贴板');
            });
        }

        function downloadArticle() {
            const content = document.getElementById('article-content').innerText;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `word-article-${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ 已下载');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
